version: "3.8"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  cache:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./server
    depends_on:
      - db
      - cache
    environment:
      DATABASE_URL: postgresql://admin:secret@db:5432/appdb
      REDIS_URL: redis://cache:6379
    ports:
      - "3001:3001"

  frontend:
    build: ./client
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"

volumes:
  pg_data:
